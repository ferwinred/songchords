# codemagic.yaml - SongChords Beta CI/CD Pipeline
# Configured for Beta Releases:
# 1. android-beta-apk: Android Beta Release - APK Direct Download
# 2. ios-beta-testflight: iOS Beta Release - TestFlight
# 3. ios-simulator-beta: iOS KMP - Simulador (video + Appetize)

definitions:
  cache_paths: &cache_paths
    - $HOME/.gradle/caches
    - $HOME/.gradle/wrapper
    - $HOME/.konan

workflows:

  # --------------------------------------------------------------------------
  # 1) Android Beta Release - APK Direct Download
  # Generates downloadable APK files for direct installation on Android devices
  # without publishing to Google Play Store.
  # --------------------------------------------------------------------------
  android-beta-apk:
    name: Android Beta Release - APK Direct Download
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    cache:
      cache_paths: *cache_paths
    scripts:
      - name: Set executable permissions for Gradle wrapper
        script: chmod +x ./gradlew

      - name: Build Android Beta APK
        script: ./gradlew assembleRelease || ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/debug/*.apk

  # --------------------------------------------------------------------------
  # 2) iOS Beta Release - TestFlight
  # Deploys iOS builds solely to TestFlight Beta testers, NOT public App Store.
  # --------------------------------------------------------------------------
  ios-beta-testflight:
    name: iOS Beta Release - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic-api-key
    environment:
      java: 17
      xcode: 15.4
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ISSUER_ID: Encrypted(...)
        APP_STORE_CONNECT_KEY_IDENTIFIER: Encrypted(...)
        APP_STORE_CONNECT_PRIVATE_KEY: Encrypted(...)
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        BUNDLE_ID: "com.example.songchords"
        APP_STORE_APPLE_ID: 1234567890
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.songchords
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    cache:
      cache_paths: *cache_paths
    scripts:
      - name: Set executable permissions for Gradle wrapper
        script: chmod +x ./gradlew

      - name: Install CocoaPods dependencies
        script: |
          if [ -f iosApp/Podfile ]; then
            cd iosApp && pod install
          fi

      - name: Build Gradle KMP framework
        script: |
          ./gradlew assemble

      - name: Configure code signing
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEW_BUILD=$((LATEST_BUILD + 1))
          if [ -d iosApp ]; then
            cd iosApp
            agvtool new-version -all "$NEW_BUILD"
          fi

      - name: Xcode Archive & IPA Packaging
        script: |
          if [ -f "$XCODE_PROJECT/project.pbxproj" ] || [ -d "$XCODE_PROJECT" ] || [ -d "${XCODE_PROJECT%.xcodeproj}.xcworkspace" ]; then
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -archivePath build/ios/archive/iosApp.xcarchive \
              archive

            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME"
          else
            echo "Xcode project or workspace not found at $XCODE_PROJECT. Skipping xcodebuild."
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  # --------------------------------------------------------------------------
  # 3) iOS Simulator Beta - KMP Framework, Simulator Build & Appetize.io
  # --------------------------------------------------------------------------
  ios-simulator-beta:
    name: iOS KMP - Simulador (video + Appetize)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    cache:
      cache_paths: *cache_paths
    scripts:
      - name: Set executable permissions for Gradle wrapper
        script: chmod +x ./gradlew

      - name: Build KMP iOS Framework for Simulator
        script: |
          ./gradlew :app:linkDebugFrameworkIosSimulatorArm64 || ./gradlew assemble

      - name: Package iOS Framework & App Artifacts
        script: |
          mkdir -p build/simulator
          FRAMEWORKS=$(find app/build -name "*.framework" 2>/dev/null)
          if [ -n "$FRAMEWORKS" ]; then
            echo "Found .framework artifacts: $FRAMEWORKS"
            zip -r build/simulator/ios-simulator-app.zip $FRAMEWORKS
          else
            echo "No .framework found in app/build. Packaging app/build directory."
            if [ -d "app/build" ]; then
              zip -r build/simulator/ios-simulator-app.zip app/build
            else
              touch build/simulator/placeholder.txt
              zip build/simulator/ios-simulator-app.zip build/simulator/placeholder.txt
            fi
          fi

      - name: Upload to Appetize.io API
        script: |
          if [ -n "$APPETIZE_API_TOKEN" ]; then
            echo "Uploading build/simulator/ios-simulator-app.zip to Appetize.io..."
            curl --fail -X POST "https://api.appetize.io/v1/apps" \
              -F "file=@build/simulator/ios-simulator-app.zip" \
              -F "token=$APPETIZE_API_TOKEN" \
              -F "platform=ios"
          else
            echo "APPETIZE_API_TOKEN is not present. Saving zip artifact for browser testing."
          fi

    artifacts:
      - build/simulator/*.zip
      - app/build/bin/**
      - app/build/outputs/**
